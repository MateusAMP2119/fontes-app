name: Deploy to Cloudflare

on:
  push:
    branches: [main]

permissions: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Trigger Cloudflare build
        env:
          DEPLOY_HOOK_URL: ${{ secrets.CLOUDFLARE_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$DEPLOY_HOOK_URL" ]; then
            echo "::error::CLOUDFLARE_DEPLOY_HOOK_URL is not configured"
            exit 1
          fi
          curl --fail --silent --show-error --max-time 60 \
            --request POST "$DEPLOY_HOOK_URL" --output response.json
          jq -e '.success == true and (.result.build_uuid | type == "string")' response.json
          jq '{success, result: {build_uuid: .result.build_uuid, status: .result.status, branch: .result.branch}}' response.json
