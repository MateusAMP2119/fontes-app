<!doctype html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="referrer" content="no-referrer"><title>Início de sessão com Google | Fontes</title>
  <style>
    :root{color-scheme:light dark;font-family:system-ui,sans-serif;color:#232326;background:#fff}*{box-sizing:border-box}[hidden]{display:none!important}body{margin:0;min-height:100svh;display:grid;place-items:center;padding:32px}main{width:100%;max-width:340px;text-align:center}img{width:36px;height:36px}h1{font-size:22px;font-weight:550;margin:28px 0 12px}p{font-size:14px;line-height:1.6;color:#727278}button,a{font:inherit;font-size:14px;color:inherit}button{margin-top:20px;padding:10px 24px;background:transparent;border:1px solid #aaa5;border-radius:8px;cursor:pointer}a{display:block;margin-top:24px}@media(prefers-color-scheme:dark){:root{background:#101012;color:#efeff0}p{color:#aaaab0}}
  </style>
</head>
<body><main><img src="/mark.png" alt="Fontes" width="36" height="36"><h1>Início de sessão com Google</h1><p id="status" role="status">Ligação ao Google em curso.</p><button id="cancel" type="button">Cancelar</button><a id="return" href="/login" hidden>Voltar à Fontes</a></main>
<script>
  const params = new URL(location.href).searchParams
  const attempt = params.get('attempt')
  const status = document.getElementById('status')
  const button = document.getElementById('cancel')
  if (attempt && /^[a-f0-9-]{36}$/.test(attempt)) {
    const channel = new BroadcastChannel('fontes-google-' + attempt)
    const send = type => {
      const message = { type, attempt }
      channel.postMessage(message)
      if (window.opener) window.opener.postMessage(message, location.origin)
    }
    channel.onmessage = event => { if (event.data?.attempt === attempt && event.data.type === 'close') window.close() }
    button.onclick = () => { send('cancel'); window.close() }
    if (params.has('complete')) {
      const failed = params.has('error')
      status.textContent = failed ? 'O início de sessão não foi concluído.' : 'Ligação confirmada. A preparar a Fontes.'
      send(failed ? 'error' : 'complete')
      // Also works when the provider isolates the popup from its original opener.
      const retry = setInterval(() => send(failed ? 'error' : 'complete'), 500)
      setTimeout(() => { clearInterval(retry); status.textContent = 'O regresso à Fontes está disponível na janela original.'; button.textContent = 'Fechar janela'; document.getElementById('return').hidden = false }, 25000)
    }
  } else {
    status.textContent = 'Esta ligação de início de sessão já não está disponível.'
    button.hidden = true
    document.getElementById('return').hidden = false
  }
</script></body></html>
